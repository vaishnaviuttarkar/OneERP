<form method="post" action="{{ url }}" class="d-inline" onsubmit="return confirm('{{ confirm|escapejs }}')">{% csrf_token %}<button type="submit" class="btn btn-sm {{ cls|default:'btn-outline-primary' }}"{% if icon %} title="{{ label }}"{% endif %}>{% if icon %}<i class="bi {{ icon }}"></i><span>{{ label }}</span>{% else %}{{ label }}{% endif %}</button></form>
